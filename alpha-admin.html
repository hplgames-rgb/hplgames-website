<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>HPL Alpha Review</title><style>body{background:#0b1428;color:#edf7ff;font:16px system-ui;margin:30px auto;max-width:900px;padding:0 20px}button,input{padding:12px;border-radius:9px;border:0;margin:5px}button{background:#58d5ec;cursor:pointer}article{background:#192640;border:1px solid #435a78;border-radius:12px;padding:20px;margin:15px 0;overflow-wrap:anywhere}.muted{color:#adbed7}.error{color:#ffb5b5}a{color:#8deaff}#panel{display:none}</style></head><body><h1>HPL Games · Alpha Applications</h1><p class="muted">Authorized administrators only. Wallet signature required; no gas fee.</p><section id="login"><button id="connect">Sign in with admin wallet</button><p id="loginmsg"></p></section><section id="panel"><button id="refresh">Refresh applications</button><button id="logout">Sign out</button><p id="status"></p><div id="items"></div></section><p><a href="/">Return to HPL Games</a></p><script>
let token='';const endpoint='https://brvnzzkatyxfxpevukzt.supabase.co/functions/v1/alpha-review';const el=id=>document.getElementById(id);
async function call(body){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function msg(id,e){el(id).textContent=e.message||String(e)}
el('connect').onclick=async()=>{el('connect').disabled=true;try{if(!window.ethereum)throw Error('Open this page in a browser with MetaMask');const [wallet]=await ethereum.request({method:'eth_requestAccounts'});const c=await call({action:'challenge',wallet_address:wallet});const signature=await ethereum.request({method:'personal_sign',params:[c.message,wallet]});const v=await call({action:'verify',wallet_address:wallet,nonce:c.nonce,signature});token=v.session_token;el('login').style.display='none';el('panel').style.display='block';await load()}catch(e){msg('loginmsg',e)}finally{el('connect').disabled=false}};
async function load(){try{el('status').textContent='Loading…';const d=await call({action:'list',session_token:token});el('items').replaceChildren();for(const a of d.applications||[]){const card=document.createElement('article');for(const value of ['Wallet address: '+a.wallet_address,'Application status: '+a.status,'Submitted: '+new Date(a.created_at).toLocaleString(),'Telegram username: '+(a.telegram_username||'Not provided'),'Reason for application: '+(a.message||'Not provided')]){if(!value)continue;const p=document.createElement('p');p.textContent=value;card.append(p)}if(a.status==='pending')for(const status of ['approved','rejected']){const b=document.createElement('button');b.textContent=status==='approved'?'Approve':'Reject';b.onclick=async()=>{if(!confirm('Confirm '+status+' for '+a.wallet_address+'?'))return;b.disabled=true;try{await call({action:'decide',session_token:token,id:a.id,status});await load()}catch(e){msg('status',e);b.disabled=false}};card.append(b)}el('items').append(card)}el('status').textContent=(d.applications||[]).length+' application(s)'}catch(e){msg('status',e)}}
el('refresh').onclick=load;el('logout').onclick=()=>{token='';el('panel').style.display='none';el('login').style.display='block'};
</script></body></html>
